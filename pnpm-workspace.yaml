# pnpm 10 は依存パッケージの postinstall を既定で実行しない。
# ネイティブバイナリの取得・検証に postinstall が要るものだけをここで許可する。
# 新しい依存で "Ignored build scripts" の警告が出たら、必要性を確認してから追記する
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver
  - workerd

# クールダウン: 公開から 3 日 (4320 分) 経っていないバージョンは解決対象にしない。
# 公開直後に見つかって取り下げられる不正パッケージを踏まないため。
# 緊急の修正をすぐ入れたいときだけ minimumReleaseAgeExclude にパッケージ名を足す
minimumReleaseAge: 4320
